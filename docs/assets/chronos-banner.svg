    <circle r="82" fill="none" stroke="url(#ring)" stroke-width="8" filter="url(#glow)"/>
    <g stroke="#d8f7ff" stroke-width="4" stroke-linecap="round">
      <path d="M0-70v12M70 0H58M0 70V58M-70 0h12"/>
      <path d="M49-49l-8 8M49 49l-8-8M-49 49l8-8M-49-49l8 8" opacity="0.65"/>
