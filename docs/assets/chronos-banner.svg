    <path d="M0 0V-43M0 0l35 22" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <circle r="9" fill="#fbbf24"/>
  </g>
  <text x="310" y="150" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="8">CHRONOS</text>
  <text x="315" y="205" fill="#a5f3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="1.5">DETERMINISTIC SCHEDULING FOR NOX</text>
  <text x="315" y="250" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">UTC cron · monotonic timers · bounded execution policies</text>
