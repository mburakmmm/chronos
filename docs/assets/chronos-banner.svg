<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Chronos</title>
  <desc id="desc">Nox-native deterministic scheduling, timers, and UTC cron</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b46"/>
      <stop offset="1" stop-color="#0b6670"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="35" r="230" fill="#22d3ee" opacity="0.05"/>
  <circle cx="115" cy="315" r="260" fill="#fbbf24" opacity="0.04"/>
  <g transform="translate(165 160)">
