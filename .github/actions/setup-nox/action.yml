name: Setup Nox
description: Install a checksum-pinned Nox release archive

inputs:
  version:
    description: Nox release version without the leading v
    required: true
  platform:
    description: Release platform suffix such as linux-x64
    required: true
  sha256:
    description: Expected SHA-256 digest of the release archive
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify Nox (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        NOX_VERSION: ${{ inputs.version }}
        NOX_PLATFORM: ${{ inputs.platform }}
        NOX_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="nox-lang-v${NOX_VERSION}-${NOX_PLATFORM}.tar.gz"
        url="https://github.com/mburakmmm/nox-lang/releases/download/v${NOX_VERSION}/${archive}"
        destination="${RUNNER_TEMP}/${archive}"
        curl --fail --location --retry 4 --retry-all-errors --output "${destination}" "${url}"
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${destination}" | awk '{print $1}')"
        else
          actual="$(shasum -a 256 "${destination}" | awk '{print $1}')"
        fi
        if [[ "${actual}" != "${NOX_SHA256}" ]]; then
          echo "Nox archive checksum mismatch: expected ${NOX_SHA256}, got ${actual}" >&2
          exit 1
        fi
        tar -xzf "${destination}" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/nox-lang-v${NOX_VERSION}-${NOX_PLATFORM}/bin" >> "${GITHUB_PATH}"

    - name: Download and verify Nox (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NOX_VERSION: ${{ inputs.version }}
        NOX_PLATFORM: ${{ inputs.platform }}
        NOX_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = "Stop"
        $archive = "nox-lang-v$env:NOX_VERSION-$env:NOX_PLATFORM.zip"
        $url = "https://github.com/mburakmmm/nox-lang/releases/download/v$env:NOX_VERSION/$archive"
        $destination = Join-Path $env:RUNNER_TEMP $archive
        Invoke-WebRequest -Uri $url -OutFile $destination
        $actual = (Get-FileHash -Path $destination -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:NOX_SHA256.ToLowerInvariant()) {
          throw "Nox archive checksum mismatch: expected $env:NOX_SHA256, got $actual"
        }
        Expand-Archive -Path $destination -DestinationPath $env:RUNNER_TEMP -Force
        $bin = Join-Path $env:RUNNER_TEMP "nox-lang-v$env:NOX_VERSION-$env:NOX_PLATFORM/bin"
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Nox installation
      shell: bash
      run: noxc version
