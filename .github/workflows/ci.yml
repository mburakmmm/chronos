name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOX_VERSION: 2.2.70
  NOX_POOL_WORKERS: 2

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux-x64
            sha256: 1920366b080bffaaf8dabef6ed4a37cd1ad4230c5b96a3b0241cba6850427b76
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            sha256: b193478ba556125b3b8bb6b8ab56a6924aeeecbdd123c5819d2287c137d11bf6
          - name: macOS arm64
            runner: macos-15
            platform: macos-arm64
            sha256: 0bcf719d1a5207e3470d8461f203b56ca086d04baaa2858cbdc6081ccebea7d1
          - name: Windows x64
            runner: windows-latest
            platform: windows-x64
            sha256: 61f40a7599ba280f3f4ba44e1332984d50c14ce33f146563de398a5ea90dcfb7

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nox
        uses: ./.github/actions/setup-nox
        with:
          version: ${{ env.NOX_VERSION }}
          platform: ${{ matrix.platform }}
          sha256: ${{ matrix.sha256 }}

      - name: Install Zig for the Windows LLVM backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zigVersion = "0.16.0"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/zig-x86_64-windows-$zigVersion.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$zigVersion") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run complete verification matrix
        env:
          NOX_HOME: ${{ runner.temp }}/chronos-nox-home
        run: python scripts/verify.py

      - name: Check repository whitespace
        run: git diff --check

  framework-integrations:
    name: Framework integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nox 2.2.70
        uses: ./.github/actions/setup-nox
        with:
          version: ${{ env.NOX_VERSION }}
          platform: linux-x64
          sha256: 1920366b080bffaaf8dabef6ed4a37cd1ad4230c5b96a3b0241cba6850427b76

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Verify locked framework integrations
        env:
          NOX_HOME: ${{ runner.temp }}/chronos-integration-nox-home
        run: python scripts/verify_integrations.py

  persistence-primitives:
    name: SQLite persistence adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nox 2.2.70
        uses: ./.github/actions/setup-nox
        with:
          version: ${{ env.NOX_VERSION }}
          platform: linux-x64
          sha256: 1920366b080bffaaf8dabef6ed4a37cd1ad4230c5b96a3b0241cba6850427b76

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Verify SQLite primitives and definition adapter
        env:
          NOX_HOME: ${{ runner.temp }}/chronos-persistence-nox-home
        run: python scripts/verify_persistence.py
